<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>KUSHAL_doc</title>
   <link rel="stylesheet" href="./style.css">
</head>

<body>
   <section>
      <form action="./home.html" method="get">
         <div>
            <label for="">student ID</label>
            <input type="number" placeholder="Student ID" required>
         </div>
         <div>
            <label for="">NAME</label>
            <input type="text" placeholder="name" required>
         </div>
         <div>
            <label for="">EMAIL</label>
            <input type="email" placeholder="email address" required>
         </div>
         <div>
            <label for="">PHONE NUMBER</label>
            <input type="tel" placeholder="mobile number" required>
         </div>
         <div>
            <label for="">COURSE</label>
            <select id="course" name="course">
               <option name="course" value="java">Java</option>
               <option name="course" value="python">Python</option>
               <option name="course" value="MERN">MERN</option>
               <option name="course" value="react">React</option>
            </select>
         </div>
         <div id="one">
            <label for="">DOB</label>
            <input type="date" required>
         </div>
         <button >
            REGISTER
         </button>
      </form>
   </section>
</body>

</html>
